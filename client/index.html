<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A simple, modern, responsive AI Chatbot powered by Google Gemini API & Express backend." />
  <title>AI Chatbot — Intelligent Assistant</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- App Container -->
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      
      <!-- Top Bar: Brand Info (Left) + Action Controls (Right) -->
      <div class="header-top-bar">
        <div class="brand">
          <div class="brand-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12L2.5 4.5"></path>
              <path d="M12 12v9.5"></path>
              <path d="M12 12h9.5"></path>
            </svg>
          </div>
          <div class="brand-info">
            <h1 class="brand-title">AI Chatbot</h1>
            <span class="status-indicator">
              <span class="status-dot"></span> Online
            </span>
          </div>
        </div>

        <!-- Controls & Action Buttons -->
        <div class="header-actions">
          <!-- Read Aloud Toggle -->
          <button id="ttsToggleBtn" class="icon-btn" title="Toggle Auto Read-Aloud (Text-to-Speech)" aria-label="Toggle Auto Read-Aloud">
            <svg class="icon tts-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <svg class="icon tts-on hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>

          <!-- Clear Chat Button -->
          <button id="clearChatBtn" class="icon-btn" title="Clear Conversation" aria-label="Clear Conversation">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>

          <!-- Export Chat Button -->
          <button id="exportChatBtn" class="icon-btn" title="Export Conversation" aria-label="Export Conversation">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>

          <!-- Dark / Light Theme Toggle -->
          <button id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Model Selector Bar -->
      <div class="header-model-bar">
        <div class="control-item model-selector-wrapper">
          <label for="modelSelect" class="sr-only">Select AI Model</label>
          <select id="modelSelect" class="control-select" title="Choose AI Model">
            <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
          </select>
        </div>
      </div>

    </header>

    <!-- Main Chat Messages View -->
    <main id="chatContainer" class="chat-container">
      
      <!-- Welcome Screen (Visible on empty chat) -->
      <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-badge">AI Chat Assistant</div>
        <h2 class="welcome-title">How can I assist you today?</h2>
        <p class="welcome-subtitle">Ask questions, generate ideas, analyze text, or write code instantly.</p>
        
        <!-- Suggested Quick Prompts -->
        <div class="prompt-chips">
          <button class="chip-btn" data-prompt="Explain quantum computing in simple terms with a real-world analogy.">
            ⚡ <span>Explain quantum computing</span>
          </button>
          <button class="chip-btn" data-prompt="Write a clean JavaScript function to filter and format JSON array data.">
            💻 <span>Write a JavaScript utility</span>
          </button>
          <button class="chip-btn" data-prompt="What are 5 actionable productivity tips for daily work organization?">
            💡 <span>Daily productivity tips</span>
          </button>
          <button class="chip-btn" data-prompt="Draft a polite email asking for a status update on a project submission.">
            📝 <span>Draft a professional email</span>
          </button>
        </div>
      </div>

      <!-- Dynamic Message Stream -->
      <div id="messageList" class="message-list" role="log" aria-live="polite"></div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="message-wrapper assistant-wrapper hidden">
        <div class="message-sender-row">
          <div class="avatar assistant-avatar" aria-hidden="true">🤖</div>
          <span class="sender-label">AI Chatbot</span>
        </div>
        <div class="bubble-container">
          <div class="bubble assistant-bubble typing-bubble">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span class="typing-text">AI Chatbot is typing...</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Input Footer Bar -->
    <footer class="app-footer">
      <form id="chatForm" class="chat-form" onsubmit="event.preventDefault();">
        
        <div class="input-wrapper">
          <textarea 
            id="userInput" 
            class="chat-input" 
            placeholder="Type your message..." 
            rows="1" 
            maxlength="4000"
            required
            aria-label="Type your message"
          ></textarea>
          
          <div class="input-actions">
            <!-- Voice Mic Input Toggle -->
            <button type="button" id="micBtn" class="action-btn mic-btn" title="Voice Input (Speech-to-Text)" aria-label="Speech input">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            
            <!-- Send Button -->
            <button type="submit" id="sendBtn" class="send-btn" title="Send Message" aria-label="Send Message">
              <svg class="icon send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              <span class="btn-spinner hidden" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="input-meta">
          <span class="meta-hint">Enter to send &bull; Shift + Enter for new line</span>
          <span id="charCounter" class="char-counter">0 / 4000</span>
        </div>

      </form>
    </footer>

    <!-- Toast Notification Overlay -->
    <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
